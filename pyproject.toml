[project]
name = "revenda"
version = "0.1.0"
description = "API de revenda de veículos (FIAP PósTech SOAT — Fase 3): catálogo, vendas e efetivação por webhook de pagamento."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0,<1.21",
    "fastapi>=0.142.2,<0.143",
    "prometheus-client>=0.26.0,<0.27",
    "psycopg[binary]>=3.3.6,<3.4",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.15.0,<2.16",
    "pyjwt[crypto]>=2.15.1,<2.16",
    "sqlalchemy>=2.1.3,<2.2",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1,<0.29",
    "import-linter>=2.15,<3",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.10,<0.17",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "S", "C4", "PT", "RET"]
ignore = [
    "RUF001", # textos em português usam caracteres que o ruff considera ambíguos (ex.: travessão)
    "RUF002",
    "RUF003",
    "B008",   # Depends()/Query() em parâmetros padrão é o idioma do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PT011"]
"migrations/**" = ["N999"]
# Aliases de tipo Annotated[..., Depends(...)] declarados dentro das fábricas de routers.
"src/revenda/*/interfaces/router.py" = ["N806"]
"src/revenda/composicao.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["revenda", "apoio"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["revenda"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-m", "not e2e", "--strict-markers", "--import-mode=importlib", "-ra"]
markers = [
    "unit: testes de unidade (sem banco, sem rede, relógio fixo)",
    "integration: testes de integração (PostgreSQL real via TEST_DATABASE_URL)",
    "e2e: testes ponta a ponta contra o ambiente implantado (API + Keycloak reais)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Aviso do starlette sobre o cliente HTTP do TestClient (biblioteca, não código nosso).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["revenda"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "class .*\\(Protocol\\):",
]

# ---------------------------------------------------------------- import-linter
# Regras da arquitetura (docs/04-arquitetura.md, seção 7): camadas por módulo,
# independência Catálogo x Vendas e domínio sem frameworks.
[tool.importlinter]
root_packages = ["revenda"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas de cada módulo (interfaces | infrastructure > application > domain)"
type = "layers"
containers = ["revenda.catalogo", "revenda.vendas"]
layers = ["interfaces | infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Catálogo e Vendas são independentes (integração só via CatalogoPort, ligada em composicao.py)"
type = "independence"
modules = ["revenda.catalogo", "revenda.vendas"]

[[tool.importlinter.contracts]]
name = "Domínio usa apenas a biblioteca padrão"
type = "forbidden"
source_modules = ["revenda.catalogo.domain", "revenda.vendas.domain"]
forbidden_modules = [
    "revenda.shared",
    "revenda.main",
    "revenda.composicao",
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "psycopg",
    "jwt",
    "alembic",
]

[[tool.importlinter.contracts]]
name = "Casos de uso não dependem de frameworks nem de adaptadores compartilhados"
type = "forbidden"
source_modules = ["revenda.catalogo.application", "revenda.vendas.application"]
forbidden_modules = [
    "revenda.main",
    "revenda.composicao",
    "revenda.shared.auth",
    "revenda.shared.http",
    "revenda.shared.db",
    "revenda.shared.config",
    "revenda.shared.errors",
    "revenda.shared.logging",
    "revenda.shared.saude",
    "fastapi",
    "starlette",
    "pydantic",
    "sqlalchemy",
    "psycopg",
    "jwt",
]

[[tool.importlinter.contracts]]
name = "shared não conhece os módulos de negócio"
type = "forbidden"
source_modules = ["revenda.shared"]
forbidden_modules = ["revenda.catalogo", "revenda.vendas", "revenda.main", "revenda.composicao"]
