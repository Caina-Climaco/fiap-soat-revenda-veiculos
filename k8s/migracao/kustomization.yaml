# Job de migracao (alembic upgrade head), aplicado pelo CD ANTES do rollout da API.
# Autossuficiente: nao depende do ConfigMap de k8s/base (no primeiro deploy ele ainda
# nao existe quando a migracao roda).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: revenda
resources:
  - job.yaml
images:
  - name: revenda-api
    newTag: dev
