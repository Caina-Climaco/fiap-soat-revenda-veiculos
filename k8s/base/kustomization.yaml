# Manifestos da aplicacao revenda-api (docs/08-ci-cd-infra.md, secao 2).
# A tag neutra "dev" e trocada no CD pelo SHA do commit (revenda-api:<sha>), sem commit.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: revenda
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
images:
  - name: revenda-api
    newTag: dev
