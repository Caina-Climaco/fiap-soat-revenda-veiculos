# So dentro do cluster (ClusterIP). A entrada pelo host e o API Gateway (Kong, ADR-015):
# localhost:8080 -> NodePort 30080 -> Kong (namespace gateway) -> este Service.
apiVersion: v1
kind: Service
metadata:
  name: revenda-api
  labels:
    app: revenda-api
    app.kubernetes.io/name: revenda-api
    app.kubernetes.io/part-of: revenda-veiculos
spec:
  type: ClusterIP
  selector:
    app: revenda-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
