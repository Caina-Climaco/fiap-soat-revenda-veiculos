# Entrega continua (docs/08-ci-cd-infra.md, secao 3.3; ADR-006 e ADR-010).
# Roda SOMENTE no runner self-hosted do PC do autor, um container Linux no Docker
# Desktop (infra/runner; labels self-hosted, Linux, kind-local), e SOMENTE em push na
# main (PR mergeado) ou disparo manual. Nenhum workflow self-hosted reage a pull_request.
# O container esta na rede docker "kind": fala com o cluster pelo nome do no
# (revenda-control-plane), com o Docker do host pelo socket montado e grava o state do
# Terraform em /revenda-state/revenda-api.tfstate (bind mount de %USERPROFILE%\.revenda,
# o mesmo arquivo usado pelo scripts/windows/04-subir-ambiente.ps1).
# O servico de identidade (Keycloak) e implantado por OUTRO repositorio
# (fiap-soat-revenda-identidade, ADR-014). Este CD so consome o contrato dele: o realm
# publicado, a senha do usuario seed e o client tecnico do e2e (Secrets keycloak-gestor e
# keycloak-e2e do namespace identidade).
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "SHA (ou branch/tag) a implantar. Vazio = commit atual da main. Use para rollback (docs/08, secao 6)."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-local
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, Linux, kind-local]
    environment: local
    timeout-minutes: 60
    env:
      KIND_CLUSTER: revenda
      NS_APP: revenda
      NS_ID: identidade
      # NodePorts pelo nome do no na rede "kind" (localhost:8080/8180 sao do host Windows).
      # O issuer dos tokens continua http://localhost:8180/realms/revenda (KC_HOSTNAME fixo).
      # 30080 = API Gateway (Kong); a API em si e ClusterIP e so o Kong chega nela (ADR-015).
      E2E_API_URL: http://revenda-control-plane:30080
      E2E_KEYCLOAK_URL: http://revenda-control-plane:30180
      PROMETHEUS_URL: http://revenda-control-plane:30900
      GRAFANA_URL: http://revenda-control-plane:30300
      STATE_DIR: /revenda-state
      TF_DATA_DIR: /home/runner/persist/terraform-data
      STATE_FILE: revenda-api.tfstate
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          clean: true
          persist-credentials: false
          # Historico completo: a validacao abaixo precisa da ancestralidade ate a main.
          fetch-depth: 0

      # Disparo manual so implanta commits que ja estao na main (revisados por PR e com CI
      # verde). Vale para qualquer workflow_dispatch: com `ref` informado ou vazio, ja que
      # o disparo manual tambem pode ser feito "a partir de" outra branch.
      - name: Valida que o commit pertence a main (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF_SOLICITADA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::O commit ${SHA} (ref solicitada: '${REF_SOLICITADA:-}', branch do disparo: '${GITHUB_REF_NAME}') nao pertence ao historico da main. O CD so implanta commits ja mergeados na main."
            exit 1
          fi
          echo "OK: ${SHA} pertence ao historico da main."
          # Commits anteriores a separacao da identidade (ADR-014) declaram o Keycloak no
          # Terraform deste repositorio e usam outro state: implanta-los conflitaria com o
          # repositorio fiap-soat-revenda-identidade.
          if [ -e infra/terraform/keycloak.tf ] || [ -d keycloak ]; then
            echo "::error::O commit ${SHA} e anterior a separacao da identidade (ADR-014) e nao pode ser implantado por este CD."
            exit 1
          fi

      - name: Contexto (SHA, diretorios, kubeconfig)
        env:
          REF_SOLICITADA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          WORK_TMP="${RUNNER_TEMP}/revenda-cd"
          KCFG="${HOME}/.kube/config"
          mkdir -p "$WORK_TMP" "$TF_DATA_DIR" "$(dirname "$KCFG")"
          if [ ! -d "$STATE_DIR" ] || [ ! -w "$STATE_DIR" ]; then
            echo "::error::${STATE_DIR} ausente ou sem escrita: o container do runner precisa do bind mount de %USERPROFILE%\\.revenda (scripts/windows/03-instalar-runner.ps1)"
            exit 1
          fi
          {
            echo "SHA=${SHA}"
            echo "IMAGEM=revenda-api:${SHA}"
            echo "KUBECONFIG=${KCFG}"
            echo "TF_VAR_kubeconfig_path=${KCFG}"
            echo "WORK_TMP=${WORK_TMP}"
          } >> "$GITHUB_ENV"
          echo "Implantando ${SHA} (evento: ${GITHUB_EVENT_NAME}, ref solicitada: '${REF_SOLICITADA:-}')"
          for ferramenta in docker kind kubectl terraform python3 curl jq base64 sed; do
            command -v "$ferramenta" >/dev/null 2>&1 || { echo "::error::Ferramenta ausente no PATH do runner: $ferramenta"; exit 1; }
          done
          docker version --format 'docker {{.Server.Version}}'
          kind version
          kubectl version --client
          terraform version

      # O cluster e criado pela CLI kind, nao pelo Terraform: o provider tehcyx/kind nao
      # tem assinatura de codigo e e bloqueado pelo Smart App Control do Windows 11 (ADR-005).
      - name: Cluster kind (cria se nao existir)
        run: |
          set -euo pipefail
          existe() {
            kind get clusters 2>/dev/null | grep -qx "$KIND_CLUSTER" \
              && [ "$(docker inspect -f '{{.State.Running}}' "${KIND_CLUSTER}-control-plane" 2>/dev/null)" = "true" ]
          }
          # Exclusao mutua entre os CDs dos dois repositorios (o cluster e compartilhado):
          # `docker network create` e atomico e falha se a rede ja existir. Sem isso, um
          # `kind create` que perde a corrida apaga, ao falhar, o no que o outro criou.
          TRAVA=revenda-kind-criando
          if existe; then
            echo "Cluster kind '$KIND_CLUSTER' ja existe."
          elif docker network create "$TRAVA" >/dev/null 2>&1; then
            trap 'docker network rm "$TRAVA" >/dev/null 2>&1 || true' EXIT
            if existe; then
              echo "Cluster kind '$KIND_CLUSTER' ja existe."
            else
              kind create cluster --config infra/kind/cluster.yaml --wait 120s
            fi
          else
            echo "O CD do outro repositorio esta criando o cluster; aguardando (ate 6 min)..."
            for _ in $(seq 1 72); do
              if existe && ! docker network inspect "$TRAVA" >/dev/null 2>&1; then break; fi
              sleep 5
            done
            existe || { echo "::error::Cluster '$KIND_CLUSTER' nao ficou pronto. Se nenhum CD estiver rodando, remova a trava: docker network rm $TRAVA"; exit 1; }
          fi
          kind export kubeconfig --internal --name "$KIND_CLUSTER"
          kubectl config current-context
          kubectl get nodes -o wide

      # Pre-requisito: o servico de identidade ja publicado (outro repositorio, outro CD).
      # Falha cedo, antes de mexer em qualquer recurso da API.
      - name: Servico de identidade publicado (contrato)
        run: |
          set -euo pipefail
          url="${E2E_KEYCLOAK_URL}/realms/revenda/.well-known/openid-configuration"
          for _ in $(seq 1 24); do
            if curl -fsS -o /dev/null --max-time 5 "$url"; then echo "OK: $url"; exit 0; fi
            sleep 5
          done
          echo "::error::Realm revenda indisponivel em $url. Implante antes o servico de identidade (repositorio fiap-soat-revenda-identidade)."
          exit 1

      - name: Terraform (revenda, API Gateway Kong, Prometheus/Grafana, metrics-server)
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          # Mesmo state do Windows (/revenda-state); TF_DATA_DIR proprio (providers linux).
          # -reconfigure: o caminho do state e fixo e vem sempre por -backend-config.
          # State unico de antes da separacao dos repositorios: os recursos dele ja existem
          # no cluster e colidiriam com este state novo. Migre antes (README, Migracao).
          if [ -e "${STATE_DIR}/terraform.tfstate" ]; then
            echo "::error::Existe ${STATE_DIR}/terraform.tfstate (ambiente anterior a separacao dos repositorios). Siga a secao 'Migracao' do README antes de implantar."
            exit 1
          fi
          # Antes do gateway, o Service revenda-api era NodePort 30080; o Kong assume essa porta.
          # Converte o Service antigo para ClusterIP (libera a porta) antes de criar o do Kong.
          if [ "$(kubectl -n "$NS_APP" get service revenda-api -o jsonpath='{.spec.type}' 2>/dev/null || true)" = "NodePort" ]; then
            echo "Service revenda-api ainda e NodePort: convertendo para ClusterIP (libera a 30080 para o Kong)"
            kubectl -n "$NS_APP" patch service revenda-api --type=json \
              -p='[{"op":"replace","path":"/spec/type","value":"ClusterIP"},{"op":"remove","path":"/spec/ports/0/nodePort"}]'
          fi
          terraform init -input=false -reconfigure -backend-config="path=${STATE_DIR}/${STATE_FILE}"
          terraform apply -input=false -auto-approve

      - name: Build da imagem ${{ env.IMAGEM }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGEM" >/dev/null 2>&1; then
            echo "Imagem $IMAGEM ja existe no Docker local (reimplantacao/rollback): build reaproveitado."
          else
            docker build --label "org.opencontainers.image.revision=${SHA}" -t "$IMAGEM" .
          fi

      - name: Carga da imagem no kind
        run: kind load docker-image "$IMAGEM" --name "$KIND_CLUSTER"

      - name: Migracao do banco (Job revenda-migracao)
        run: |
          set -euo pipefail
          kubectl -n "$NS_APP" delete job revenda-migracao --ignore-not-found --wait=true
          manifesto="${WORK_TMP}/migracao.yaml"
          kubectl kustomize k8s/migracao > "$manifesto"
          # Troca a imagem neutra (revenda-api:dev ou revenda-api sem tag) pela tag do SHA
          sed -E -i "s#^([[:space:]]*-?[[:space:]]*image:[[:space:]]*[\"']?)revenda-api(:[A-Za-z0-9._-]+)?([\"']?)[[:space:]]*\$#\1revenda-api:${SHA}\3#" "$manifesto"
          grep -q "revenda-api:${SHA}" "$manifesto" || { echo "::error::Imagem revenda-api nao encontrada no manifesto renderizado de k8s/migracao"; exit 1; }
          kubectl apply -n "$NS_APP" -f "$manifesto"
          echo "Aguardando o Job (ate 300 s)..."
          # Duas esperas em paralelo: `complete` (sucesso) e `failed` (backoffLimit esgotado),
          # para falhar logo em vez de esperar o timeout. A decisao final vem do status do Job.
          kubectl -n "$NS_APP" wait --for=condition=complete --timeout=300s job/revenda-migracao &
          espera_ok=$!
          kubectl -n "$NS_APP" wait --for=condition=failed --timeout=300s job/revenda-migracao >/dev/null 2>&1 &
          espera_falha=$!
          wait -n "$espera_ok" "$espera_falha" || true
          kill "$espera_ok" "$espera_falha" 2>/dev/null || true
          concluidos="$(kubectl -n "$NS_APP" get job revenda-migracao -o jsonpath='{.status.succeeded}' 2>/dev/null || true)"
          if [ "${concluidos:-0}" -lt 1 ]; then
            echo "::error::Migracao nao concluiu (Job revenda-migracao sem sucesso). Deployment NAO foi alterado."
            kubectl -n "$NS_APP" describe job revenda-migracao || true
            kubectl -n "$NS_APP" logs job/revenda-migracao --all-containers --tail=200 || true
            exit 1
          fi
          kubectl -n "$NS_APP" logs job/revenda-migracao --all-containers --tail=50 || true

      - name: Deploy da revenda-api (k8s/base)
        run: |
          set -euo pipefail
          # Renderiza a base, troca a imagem neutra pela tag do SHA e aplica de uma vez.
          # (Aplicar a base com revenda-api:dev e so depois usar `set image` criaria um
          # ReplicaSet intermediario com imagem inexistente e quebraria o `rollout undo`.)
          manifesto="${WORK_TMP}/base.yaml"
          kubectl kustomize k8s/base > "$manifesto"
          sed -E -i "s#^([[:space:]]*-?[[:space:]]*image:[[:space:]]*[\"']?)revenda-api(:[A-Za-z0-9._-]+)?([\"']?)[[:space:]]*\$#\1revenda-api:${SHA}\3#" "$manifesto"
          grep -q "revenda-api:${SHA}" "$manifesto" || { echo "::error::Imagem revenda-api nao encontrada no manifesto renderizado de k8s/base"; exit 1; }
          kubectl apply -f "$manifesto"
          # Garantia idempotente (sem efeito se o apply ja definiu a mesma imagem); container `api` e contrato.
          kubectl -n "$NS_APP" set image deployment/revenda-api "api=${IMAGEM}"
          kubectl -n "$NS_APP" annotate deployment/revenda-api kubernetes.io/change-cause="CD ${SHA}" --overwrite
          if ! kubectl -n "$NS_APP" rollout status deployment/revenda-api --timeout=180s; then
            echo "::error::Rollout nao concluiu em 180 s"
            kubectl -n "$NS_APP" get pods -o wide || true
            kubectl -n "$NS_APP" describe deployment revenda-api || true
            kubectl -n "$NS_APP" logs deployment/revenda-api --all-containers --tail=100 || true
            exit 1
          fi
          atual="$(kubectl -n "$NS_APP" get deployment revenda-api -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')"
          [ "$atual" = "$IMAGEM" ] || { echo "::error::Deployment com imagem inesperada: '$atual' (esperada: $IMAGEM)"; exit 1; }
          kubectl -n "$NS_APP" get deployment,pods,svc,hpa -o wide

      - name: Aguarda API pronta
        run: |
          set -euo pipefail
          esperar() {
            local url="$1" limite="$2" inicio
            inicio=$(date +%s)
            until curl -fsS -o /dev/null --max-time 5 "$url"; do
              if [ $(( $(date +%s) - inicio )) -ge "$limite" ]; then
                echo "::error::Sem resposta 2xx de $url em ${limite} s"
                return 1
              fi
              sleep 5
            done
            echo "OK: $url"
          }
          esperar "${E2E_API_URL}/health/ready" 180

      # O Kong ja respondeu ao /health/ready acima; aqui se confere que o monitoramento
      # enxerga a API e o gateway e que o painel e os alertas foram provisionados (ADR-016).
      - name: Monitoramento (Prometheus coleta API e Kong; Grafana com o painel)
        run: |
          set -euo pipefail
          consulta() {
            curl -fsS --max-time 5 --get "${PROMETHEUS_URL}/api/v1/query" --data-urlencode "query=$1" \
              | jq -r '.data.result[0].value[1] // "0"'
          }
          for job in revenda-api kong; do
            for _ in $(seq 1 24); do
              alvos="$(consulta "count(up{job=\"${job}\"} == 1)" || echo 0)"
              [ "${alvos:-0}" != "0" ] && break
              sleep 5
            done
            [ "${alvos:-0}" != "0" ] || { echo "::error::Prometheus sem alvos ativos do job ${job}"; exit 1; }
            echo "OK: Prometheus coleta ${alvos} alvo(s) do job ${job}"
          done
          grupos="$(curl -fsS --max-time 5 "${PROMETHEUS_URL}/api/v1/rules" | jq '.data.groups | length')"
          [ "$grupos" -ge 3 ] || { echo "::error::Regras de alerta nao carregadas (${grupos} grupos)"; exit 1; }
          echo "OK: ${grupos} grupos de regras de alerta carregados"
          curl -fsS --max-time 5 "${GRAFANA_URL}/api/health" >/dev/null
          titulo="$(curl -fsS --max-time 5 "${GRAFANA_URL}/api/dashboards/uid/revenda-visao-geral" | jq -r '.dashboard.title')"
          echo "OK: Grafana com o painel '${titulo}'"
          # O painel so serve se o Grafana consegue consultar o Prometheus (plugin registrado e
          # fonte de dados alcancavel): mesma consulta que um painel faz, como Viewer anonimo.
          corpo='{"queries":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},"expr":"count(up == 1)","instant":true}],"from":"now-5m","to":"now"}'
          for _ in $(seq 1 24); do
            resposta="$(curl -sS --max-time 10 -H 'Content-Type: application/json' -d "$corpo" "${GRAFANA_URL}/api/ds/query" || true)"
            valor="$(printf '%s' "$resposta" | jq -r '.results.A.frames[0].data.values[1][0] // empty' 2>/dev/null || true)"
            [ -n "$valor" ] && [ "$valor" != "0" ] && break
            sleep 5
          done
          if [ -z "${valor:-}" ] || [ "$valor" = "0" ]; then
            echo "::error::Grafana nao consulta o Prometheus: ${resposta:0:300}"
            exit 1
          fi
          echo "OK: Grafana consulta o Prometheus (${valor} alvos up)"

      - name: Python 3.12 para o e2e
        # python3 da imagem do runner (Ubuntu 24.04); sem actions/setup-python
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] >= (3, 12), sys.version'

      - name: Dependencias do e2e (pytest + httpx, isoladas do pacote revenda)
        run: |
          set -euo pipefail
          python3 -m venv "${WORK_TMP}/e2e-venv"
          VENV_PY="${WORK_TMP}/e2e-venv/bin/python"
          "$VENV_PY" -m pip install --disable-pip-version-check --quiet -r tests/e2e/requirements.txt
          "$VENV_PY" -m pytest --version
          echo "VENV_PY=${VENV_PY}" >> "$GITHUB_ENV"

      - name: Testes ponta a ponta (pytest -m e2e)
        id: e2e
        run: |
          set -euo pipefail
          segredo() {
            # Uso: segredo <namespace> <secret> <chave>
            local valor
            valor="$(kubectl -n "$1" get secret "$2" -o jsonpath="{.data.$3}" | base64 -d)"
            if [ -z "$valor" ]; then echo "::error::Secret $1/$2 sem a chave $3" >&2; return 1; fi
            printf '%s' "$valor"
          }
          E2E_GESTOR_PASSWORD="$(segredo "$NS_ID" keycloak-gestor GESTOR_PASSWORD)"
          echo "::add-mask::${E2E_GESTOR_PASSWORD}"
          E2E_WEBHOOK_SECRET="$(segredo "$NS_APP" revenda-webhook-secret WEBHOOK_SECRET)"
          echo "::add-mask::${E2E_WEBHOOK_SECRET}"
          # Contrato com o servico de identidade: client tecnico do e2e (nunca o admin master)
          E2E_KC_CLIENT_ID="$(segredo "$NS_ID" keycloak-e2e E2E_ADMIN_CLIENT_ID)"
          E2E_KC_CLIENT_SECRET="$(segredo "$NS_ID" keycloak-e2e E2E_ADMIN_CLIENT_SECRET)"
          echo "::add-mask::${E2E_KC_CLIENT_SECRET}"
          export E2E_GESTOR_PASSWORD E2E_WEBHOOK_SECRET E2E_KC_CLIENT_ID E2E_KC_CLIENT_SECRET
          # No CD a ausencia de variaveis e erro (nunca skip silencioso).
          export E2E_EXIGIR=1
          # A API so e alcancavel pelo Kong: os testes do gateway sao obrigatorios aqui.
          export E2E_GATEWAY=1
          # tests/e2e/pytest.ini isola a configuracao do pyproject (addopts -m "not e2e").
          "$VENV_PY" -m pytest tests/e2e -m e2e -p no:cacheprovider -o addopts="" \
            -v -rA --junitxml="${WORK_TMP}/e2e-junit.xml"

      - name: Diagnostico em falha
        if: ${{ failure() }}
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n "$NS_APP" get events --sort-by=.lastTimestamp | tail -n 40 || true
          kubectl -n "$NS_APP" logs deployment/revenda-api --all-containers --tail=200 || true
          kubectl -n gateway logs deployment/kong --tail=80 || true
          kubectl -n observabilidade get pods -o wide || true
          echo "Rollback: Actions > CD > Run workflow com ref=<sha-anterior>, ou 'kubectl -n revenda rollout undo deployment/revenda-api' (docs/08, secao 6)."

      - name: Resumo da implantacao
        if: ${{ always() }}
        run: |
          {
            echo "## Deploy local (kind \`${KIND_CLUSTER}\`)"
            echo ""
            echo "| Item | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${SHA:-?}\` |"
            echo "| Imagem | \`${IMAGEM:-?}\` |"
            echo "| Evento | ${GITHUB_EVENT_NAME} |"
            pronto="$(kubectl -n "$NS_APP" get deployment revenda-api -o jsonpath='{.status.readyReplicas}/{.status.replicas}' 2>/dev/null || echo '?')"
            echo "| Replicas prontas | ${pronto} |"
            echo "| Resultado do e2e | ${{ steps.e2e.outcome || 'nao executado' }} |"
            if [ -f "${WORK_TMP:-/nonexistent}/e2e-junit.xml" ]; then
              linha="$(grep -o '<testsuite [^>]*>' "${WORK_TMP}/e2e-junit.xml" | head -n 1)"
              attr() { printf '%s' "$linha" | sed -n "s/.* $1=\"\([^\"]*\)\".*/\1/p"; }
              echo "| Testes e2e | $(attr tests) total, $(attr failures) falhas, $(attr errors) erros, $(attr skipped) pulados |"
            fi
            echo "| API pelo API Gateway (no PC) | http://localhost:8080 (Swagger em http://localhost:8080/docs) |"
            echo "| Grafana / Prometheus (no PC) | http://localhost:3000 / http://localhost:9090 |"
            echo "| Keycloak (no PC) | http://localhost:8180 |"
            echo "| Testado pelo runner em | ${E2E_API_URL} e ${E2E_KEYCLOAK_URL} (rede kind) |"
            echo ""
            echo "Rollback: Actions > CD > Run workflow com \`ref\` = SHA anterior (docs/08-ci-cd-infra.md, secao 6)."
          } >> "$GITHUB_STEP_SUMMARY"
