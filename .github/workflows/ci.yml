# Integracao continua (docs/08-ci-cd-infra.md, secao 3.2; ADR-006).
# Roda no runner hospedado do GitHub, sem segredos e sem acesso ao cluster.
# Os nomes dos jobs `qualidade`, `testes`, `imagem` e `infra` sao required status
# checks da main: NAO renomear. Nao usar paths-ignore: os checks obrigatorios
# precisam rodar em todo PR (inclusive PRs so de documentacao).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Um push novo no PR cancela a execucao anterior; na main nada e cancelado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "~1.16"
  KUBECONFORM_VERSION: "v0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  # Versao padrao da trivy-action v0.36.0; posterior as versoes comprometidas
  # (v0.69.4-v0.69.6, GHSA-69fq-xp46-6x23).
  TRIVY_VERSION: "v0.70.0"

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependencias (uv.lock congelado)
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: Contratos de camadas e modulos (import-linter)
        run: uv run lint-imports

  testes:
    name: testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Mesma versao fixa do docker-compose.yml e do Terraform (infra/terraform/variables.tf).
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: revenda
          POSTGRES_PASSWORD: revenda
          POSTGRES_DB: revenda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revenda -d revenda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://revenda:revenda@localhost:5432/revenda_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependencias (uv.lock congelado)
        run: uv sync --frozen

      - name: Unidade + integracao com cobertura (minimo 80%)
        run: >-
          uv run pytest -m "unit or integration"
          --cov=revenda --cov-branch
          --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: Publica relatorio de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  imagem:
    name: imagem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build revenda-api:${{ github.sha }} (sem push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: revenda-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # trivy-action fixada por SHA de commit (v0.36.0): em marco/2026 as tags da
      # trivy-action foram sequestradas (GHSA-69fq-xp46-6x23); tag mutavel nao e confiavel.
      # Politica (docs/08, secao do CI): so CRITICAL corrigivel bloqueia o PR; HIGH e
      # informativo (job summary) para um CVE novo nao travar todo PR do dia.
      - name: Trivy - vulnerabilidades da imagem (CRITICAL corrigiveis bloqueiam)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: revenda-api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          exit-code: "1"

      - name: Trivy - vulnerabilidades HIGH corrigiveis (informativo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: image
          image-ref: revenda-api:${{ github.sha }}
          severity: HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          output: trivy-high.txt
          exit-code: "0"

      - name: Trivy - HIGH no resumo do job
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Trivy - vulnerabilidades HIGH corrigiveis na imagem (informativo, nao bloqueia)"
            echo
            if [ -s trivy-high.txt ] && grep -q "Total:" trivy-high.txt; then
              echo '```'
              cat trivy-high.txt
              echo '```'
            else
              echo "Nenhuma vulnerabilidade HIGH corrigivel encontrada."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy - segredos no repositorio
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff infra/terraform

      - name: terraform init (sem backend)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=infra/terraform validate

      - name: Instala kubeconform ${{ env.KUBECONFORM_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/kubeconform.tar.gz" "$url"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}" kubeconform
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"

      # Mesmo renderizador usado pelo CD (kubectl kustomize, embutido no kubectl da imagem
      # ubuntu-latest), para o CI validar exatamente o que sera aplicado no cluster.
      - name: kubectl kustomize + kubeconform (k8s/base, k8s/migracao e k8s/saneamento)
        run: |
          set -euo pipefail
          kubectl version --client
          for dir in k8s/base k8s/migracao k8s/saneamento; do
            echo "::group::$dir"
            if [ ! -f "$dir/kustomization.yaml" ] && [ ! -f "$dir/kustomization.yml" ] && [ ! -f "$dir/Kustomization" ]; then
              echo "::error::$dir sem kustomization.yaml (contrato DESIGN_BRIEF 14.4)"
              exit 1
            fi
            saida="${RUNNER_TEMP}/$(echo "$dir" | tr '/' '-').yaml"
            kubectl kustomize "$dir" > "$saida"
            cat "$saida"
            kubeconform -strict -ignore-missing-schemas -summary -output text "$saida"
            echo "::endgroup::"
          done

      # API Gateway (ADR-015): a configuracao declarativa do Kong e um template do Terraform;
      # aqui ela e renderizada com valores de teste e validada pelo proprio Kong.
      - name: Kong (kong config parse da configuracao declarativa)
        env:
          KONG_IMAGEM: kong:3.9.3
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/kong"
          # \$ escapado: os placeholders ${...} do template sao literais aqui
          sed -e "s/\${webhook_secret}/segredo-de-teste-do-ci/" \
              -e "s/\${limite_geral_minuto}/600/" \
              -e "s/\${limite_compra_minuto}/60/" \
              infra/kong/kong.yml.tftpl > "${RUNNER_TEMP}/kong/kong.yml"
          if grep -nF "\${" "${RUNNER_TEMP}/kong/kong.yml"; then
            echo "::error file=infra/kong/kong.yml.tftpl::placeholder sem valor de teste no CI"
            exit 1
          fi
          docker run --rm -e KONG_DATABASE=off -v "${RUNNER_TEMP}/kong:/k:ro" "$KONG_IMAGEM" \
            kong config parse /k/kong.yml

      # Monitoramento (ADR-016): sintaxe da configuracao, das regras e testes de unidade dos
      # alertas (promtool test rules), e o painel do Grafana como JSON valido.
      - name: Prometheus (promtool check + test rules) e painel do Grafana
        env:
          PROMETHEUS_IMAGEM: prom/prometheus:v3.14.0
        run: |
          set -euo pipefail
          promtool() {
            docker run --rm -v "$PWD/infra/observabilidade:/o:ro" -w /o --entrypoint promtool \
              "$PROMETHEUS_IMAGEM" "$@"
          }
          # O arquivo de regras e montado no pod em /etc/prometheus; aqui, no diretorio atual
          sed 's#/etc/prometheus/alertas.yml#alertas.yml#' infra/observabilidade/prometheus.yml \
            > infra/observabilidade/.prometheus-ci.yml
          promtool check config .prometheus-ci.yml
          rm -f infra/observabilidade/.prometheus-ci.yml
          promtool check rules alertas.yml
          promtool test rules alertas.test.yml
          painel=infra/observabilidade/grafana/painel-revenda.json
          jq -e '.uid == "revenda-visao-geral" and (.panels | length) > 0' "$painel" >/dev/null
          # Todo painel usa a fonte de dados provisionada (uid prometheus)
          jq -e '[.panels[] | select(.type != "row") | .datasource.uid] | all(. == "prometheus")' "$painel" >/dev/null
          echo "Monitoramento OK"

      - name: Cluster kind (infra/kind/cluster.yaml valido e portas do contrato)
        run: |
          set -euo pipefail
          arquivo=infra/kind/cluster.yaml
          # yq (mikefarah) vem na imagem ubuntu-latest; falha se o YAML for invalido
          yq -e '.kind == "Cluster" and .name == "revenda"' "$arquivo" >/dev/null \
            || { echo "::error file=${arquivo}::YAML invalido ou sem kind: Cluster / name: revenda"; exit 1; }
          for par in 30080:8080 30180:8180 30432:15432 30300:3000 30900:9090; do
            c="${par%%:*}"; h="${par##*:}"
            yq -e "[.nodes[].extraPortMappings[] | select(.containerPort == ${c} and .hostPort == ${h})] | length == 1" "$arquivo" >/dev/null \
              || { echo "::error file=${arquivo}::extraPortMapping ${c} -> ${h} ausente"; exit 1; }
          done
          yq -e '.nodes[0].image | test("^kindest/node:v[0-9.]+@sha256:[0-9a-f]{64}$")' "$arquivo" >/dev/null \
            || { echo "::error file=${arquivo}::imagem do no deve ser fixada por digest"; exit 1; }
          echo "Config do kind OK"

      - name: Runner em container (hadolint no Dockerfile, shellcheck no entrypoint)
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          set -euo pipefail
          shellcheck --version | head -n 2
          shellcheck infra/runner/entrypoint.sh
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  ${RUNNER_TEMP}/hadolint" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/hadolint"
          "${RUNNER_TEMP}/hadolint" infra/runner/Dockerfile
          echo "Runner OK"

  # Valida o titulo do PR (vira a mensagem do squash na main) no formato
  # Conventional Commits (docs/08, secao 4.3). Nao e required check.
  titulo-pr:
    name: titulo-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional Commits
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([a-z0-9._-]+\))?!?: .+'
          if [[ "$TITULO" =~ $padrao ]]; then
            echo "Titulo OK: $TITULO"
          else
            echo "::error::Titulo do PR fora do padrao Conventional Commits: '$TITULO'. Exemplo: 'feat(vendas): efetivar venda via webhook'"
            exit 1
          fi
