# Configuracao propria dos testes e2e. Quando o pytest recebe `tests/e2e` como
# caminho, este arquivo vira o arquivo de configuracao (rootdir = tests/e2e), o que
# isola o e2e do pyproject.toml da aplicacao (addopts com -m "not e2e", cobertura,
# plugins) e impede o carregamento de conftest.py de diretorios acima.
# Execucao: pytest tests/e2e -m e2e -p no:cacheprovider -o addopts=""
[pytest]
markers =
    e2e: testes ponta a ponta contra o ambiente implantado (API em E2E_API_URL, Keycloak em E2E_KEYCLOAK_URL)
addopts = -ra
xfail_strict = true
