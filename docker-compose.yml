# Ambiente de DESENVOLVIMENTO da API que espelha o cluster kind (docs/04-arquitetura.md, seção 5):
#   API        http://localhost:8080  (Swagger UI em /docs)      -> container 8000
#   PostgreSQL da API (revenda-db), sem nenhum dado pessoal.
#
# O serviço de identidade NÃO está aqui: ele é outro repositório
# (fiap-soat-revenda-identidade), com o próprio docker-compose. Suba-o antes:
#   (no repositório de identidade)  docker compose up -d       -> http://localhost:8180
# A API só depende do contrato público dele: o issuer http://localhost:8180/realms/revenda
# e o JWKS, que o container da API busca pelo host (host.docker.internal:8180).
#
# Uso:
#   cp .env.example .env        # e troque os valores (o .env é ignorado pelo Git)
#   docker compose up -d --build
#   docker compose up -d postgres   # só o banco, para os testes de integração (porta 5432)
#
# Segredos vêm do .env; nada sensível é versionado aqui.

name: revenda

services:
  # ------------------------------------------------------------ banco da API
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-revenda}
      POSTGRES_USER: ${DB_USER:-revenda}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    configs:
      # Banco extra para os testes de integração (TEST_DATABASE_URL .../revenda_test).
      - source: banco-de-testes
        target: /docker-entrypoint-initdb.d/10-revenda-test.sql
    volumes:
      - revenda-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      revenda:
        aliases: [revenda-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------ migração (= Job do k8s)
  migracao:
    build: .
    image: revenda-api:dev
    command: ["python", "-m", "revenda.migracao"]
    environment: &ambiente-db
      DB_HOST: revenda-db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-revenda}
      DB_USER: ${DB_USER:-revenda}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [revenda]
    restart: "no"

  # ------------------------------------------------------------ API
  api:
    image: revenda-api:dev
    environment:
      <<: *ambiente-db
      # iss dos tokens = endereço público do Keycloak (o navegador loga por ele)...
      OIDC_ISSUER: http://localhost:8180/realms/revenda
      # ...e as chaves vêm do mesmo serviço, alcançado a partir do container pelo host.
      OIDC_JWKS_URL: http://host.docker.internal:8180/realms/revenda/protocol/openid-connect/certs
      OIDC_AUDIENCE: revenda-api
      OIDC_SWAGGER_CLIENT_ID: revenda-swagger
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET no .env}
      RESERVA_TTL_MINUTOS: ${RESERVA_TTL_MINUTOS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8080:8000"
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # host.docker.internal: no Docker Desktop (Windows/macOS) ele alcança o 127.0.0.1:8180
    # publicado pelo compose da identidade. No Docker Engine do Linux, o host-gateway é a
    # docker0 e não enxerga portas presas a 127.0.0.1: lá, publique o Keycloak em 8180:8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migracao:
        condition: service_completed_successfully
    networks: [revenda]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

configs:
  banco-de-testes:
    content: |
      CREATE DATABASE revenda_test;

volumes:
  revenda-db:

networks:
  revenda:
